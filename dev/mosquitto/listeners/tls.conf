# MQTTS — mode cible. Certificats générés par scripts/generate-certs.sh (ECDSA P-256),
# recopiés par entrypoint.sh pour que l'utilisateur mosquitto puisse lire la clé.
listener 8883
cafile /mosquitto/data/certs/ca.crt
certfile /mosquitto/data/certs/mosquitto.crt
keyfile /mosquitto/data/certs/mosquitto.key
# TLS 1.2 minimum : l'ESP8266 (BearSSL) ne parle pas TLS 1.3.
tls_version tlsv1.2
