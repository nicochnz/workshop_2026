# Réglages communs à tous les listeners (authentification et ACL identiques en clair et en TLS).
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Listeners activés par entrypoint.sh (copiés depuis listeners/) :
#   plain.conf → 1883 en clair, fallback temporaire (MQTT_PLAIN_LISTENER=off pour le couper)
#   tls.conf   → 8883 MQTTS, activé dès que certs/mosquitto/ est rempli
include_dir /mosquitto/data/listeners
