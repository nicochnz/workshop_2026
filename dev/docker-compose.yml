# Broker MQTT et base de DÉVELOPPEMENT uniquement (1883 et 55432, en clair).
# La version officielle (TLS, durcissement, réseau interne) est gérée par INFRA / CYBER.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sx-mosquitto-dev
    entrypoint: ["sh", "/dev-entrypoint.sh"]
    env_file: .env
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/dev-acl:ro
      - ./mosquitto/entrypoint.sh:/dev-entrypoint.sh:ro
    restart: unless-stopped

  # Base de développement de l'API. En production, la base n'est jamais exposée
  # sur le réseau de table (contrat §7) : seul le réseau Docker interne y accède.
  db:
    image: postgres:16-alpine
    container_name: sx-postgres-dev
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 55432 côté hôte : évite le conflit avec un PostgreSQL déjà installé sur le poste.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API + dashboard, comme en production. Lancé seulement avec le profil "full" :
  #   docker compose -f dev/docker-compose.yml --profile full up -d --build
  # Sans ce profil, on lance l'API à la main (npm run dev) pour développer.
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: sentinel-api:dev
    container_name: sx-api-dev
    env_file: ../api/.env  # jetons, limites… (les valeurs ci-dessous priment)
    environment:
      NODE_ENV: production
      PORT: 8080
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      ALLOWED_ORIGINS: http://localhost:8080
      DASHBOARD_DIR: public
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
