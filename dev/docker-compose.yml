# Stack Sentinel-X (base de la version INFRA). Certificats : ./scripts/generate-certs.sh,
# détails et bascule TLS / fallback dans docs/tls.md.
#   docker compose -f dev/docker-compose.yml up -d                                   broker + base
#   docker compose -f dev/docker-compose.yml --profile full up -d --build            + API/dashboard (MQTTS)
#   docker compose -f dev/docker-compose.yml --profile full --profile https up -d    + HTTPS (nginx)
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sx-mosquitto-dev
    entrypoint: ["sh", "/dev-entrypoint.sh"]
    env_file: .env
    environment:
      MQTT_PLAIN_LISTENER: ${MQTT_PLAIN_LISTENER:-on}  # off en phase 3
    ports:
      - "8883:8883"  # MQTTS : ESP8266, IA, simulateur
      - "1883:1883"  # clair : FALLBACK TEMPORAIRE, à retirer en phase 3 (docs/tls.md)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/listeners:/dev-listeners:ro
      - ./mosquitto/acl:/dev-acl:ro
      - ./mosquitto/entrypoint.sh:/dev-entrypoint.sh:ro
      # ca.crt + mosquitto.crt + mosquitto.key uniquement (jamais la clé de la CA)
      - ../certs/mosquitto:/certs:ro
    restart: unless-stopped

  # Base de développement de l'API. En production, la base n'est jamais exposée
  # sur le réseau de table (contrat §7) : seul le réseau Docker interne y accède.
  db:
    image: postgres:16-alpine
    container_name: sx-postgres-dev
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 55432 côté hôte : évite le conflit avec un PostgreSQL déjà installé sur le poste.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API + dashboard, comme en production. Lancé seulement avec le profil "full".
  # Sans ce profil, on lance l'API à la main (npm run dev) pour développer.
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: sentinel-api:dev
    container_name: sx-api-dev
    env_file: ../api/.env  # jetons, limites… (les valeurs ci-dessous priment)
    environment:
      NODE_ENV: production
      PORT: 8080
      # Mode cible MQTTS. Fallback démo : API_MQTT_URL=mqtt://mosquitto:1883 dans dev/.env
      MQTT_URL: ${API_MQTT_URL:-mqtts://mosquitto:8883}
      MQTT_CA_FILE: /certs/ca.crt  # ignoré en mqtt://
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      # HTTP :8080 (fallback) et HTTPS via le proxy. Ajouter l'IP du serveur sur le réseau de table.
      ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:8080,https://localhost}
      # Seul le proxy (IP fixe sur le réseau edge) peut fixer l'IP client via X-Forwarded-For.
      TRUST_PROXY: 172.30.10.10
      DASHBOARD_DIR: public
    volumes:
      - ../certs/public:/certs:ro  # CA publique seule : aucune clé privée dans l'API
    ports:
      - "8080:8080"  # HTTP : accès direct, fallback pendant la migration HTTPS
    networks: [default, edge]
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy HTTPS : dashboard + REST + WebSocket (wss) + flux vidéo IA, même origine.
  proxy:
    profiles: ["https"]
    image: nginx:1.27-alpine
    container_name: sx-proxy-dev
    environment:
      HTTPS_PORT: ${PROXY_HTTPS_PORT:-443}
      # Script IA lancé sur l'hôte (hors Docker), flux MJPEG sur :5000
      AI_VIDEO_UPSTREAM: ${AI_VIDEO_UPSTREAM:-http://host.docker.internal:5000}
    ports:
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTP_PORT:-80}:80"  # redirige vers HTTPS
    volumes:
      - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../certs/proxy:/etc/nginx/certs:ro  # proxy.crt + proxy.key uniquement
    extra_hosts:
      - "host.docker.internal:host-gateway"  # nécessaire sous Linux (Raspberry Pi)
    networks:
      edge:
        ipv4_address: 172.30.10.10
    depends_on:
      - api
    restart: unless-stopped

networks:
  # Réseau proxy ↔ API, sous-réseau fixe pour que l'API ne fasse confiance qu'au proxy.
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
