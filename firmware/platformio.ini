; Firmware Sentinel-X — boîtier SX-003 (NodeMCU V3 / ESP8266)

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 160 MHz : le handshake TLS (ECDSA) passe d'environ 2 s à 1 s
board_build.f_cpu = 160000000L
; Date de compilation : heure minimale fournie au TLS si le NTP est injoignable (docs/tls.md §4)
build_flags = -D BUILD_UNIX_TIME=$UNIX_TIME
monitor_filters = esp8266_exception_decoder, time
lib_deps =
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5

; Diagnostic du capteur ultrason, indépendant du firmware (diag/ultrasonic_diag.cpp).
;   pio run -e diag-ultrason -t upload   puis   pio device monitor
; Reflasher ensuite le firmware normal : pio run -e nodemcuv2 -t upload
[env:diag-ultrason]
extends = env:nodemcuv2
build_src_filter = -<*> +<../diag/ultrasonic_diag.cpp>
lib_deps =
